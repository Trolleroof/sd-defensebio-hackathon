[project]
name = "physbench"
version = "0.1.0"
description = "Agent environment for building personalized physiology predictors from wearable recordings"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "pyyaml>=6",
    "openai>=1.40",
    "matplotlib>=3.8",
]

[project.scripts]
physbench = "physbench.cli:main"
physbench-benchmark = "benchmark.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["physbench", "benchmark"]
