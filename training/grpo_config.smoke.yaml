# Tiny-model smoke config: proves the wiring end to end on one GPU. Not a training recipe.
# Inherits everything from grpo_config.yaml and overrides only what is listed.
extends: grpo_config.yaml

model:
  # Smoke only: a tiny instruct model with a tool-calling chat template. Swap freely; this is
  # NOT the base-model choice (which remains open, owned by Nikhil).
  base_model: Qwen/Qwen2.5-0.5B-Instruct

env:
  max_turns: 6
  tool_result_chars: 1000
  backend: linux-pod

grpo:
  group_size: 2
  tasks_per_batch: 1
  max_concurrent_episodes: 2

generation:
  max_tokens_per_turn: 256
  max_prompt_tokens: 2048
  max_response_tokens: 4096

optim:
  ppo_mini_batch_size: 2

trainer:
  total_training_steps: 2
  save_freq: 1
  test_freq: -1
  experiment_name: smoke
  n_gpus_per_node: 1
  agent_loop_workers: 1
  rollout_gpu_memory_utilization: 0.4
